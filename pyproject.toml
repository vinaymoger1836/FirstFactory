[project]
name = "factory-layout-platform"
version = "0.0.0"
description = "Workspace root for the Factory Layout Platform"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.15",
  "mypy>=1.18",
  "httpx>=0.28",
]

[tool.uv]
package = false
# Supply-chain guard: ignore anything published in the last ~2 weeks.
# Move this date forward deliberately between phases (docs/versions.md).
exclude-newer = "2026-10-28T00:00:00Z"

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker",
  "packages/domain",
  "packages/engines",
  "packages/agents",
  "packages/library",
]

[tool.uv.sources]
fl-domain = { workspace = true }
fl-engines = { workspace = true }
fl-agents = { workspace = true }
fl-library = { workspace = true }

# ── ruff ───────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["spikes/**/out", "apps/web", "packages/ts-types", "docs", "*.md"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "S", "ASYNC", "PT", "N", "DTZ", "T20",
]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["fl_api", "fl_worker", "fl_domain", "fl_engines", "fl_agents", "fl_library"]

[tool.ruff.lint.per-file-ignores]
# Spikes are throwaway measurement scripts: keep correctness rules, relax style.
"spikes/**" = ["T20", "S", "E501", "ASYNC", "RUF012", "DTZ"]
"scripts/**" = ["T20", "S603", "S607"]
"**/migrations/**" = ["N999"]
"packages/library/src/fl_library/cli.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

# ── mypy ───────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["spikes/", "build/", "apps/web/"]

# Strict where the numbers live (CLAUDE.md conventions)
[[tool.mypy.overrides]]
module = ["fl_domain.*", "fl_engines.*", "fl_library.*"]
strict = true
