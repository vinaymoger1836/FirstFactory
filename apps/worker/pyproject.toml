[project]
name = "fl-worker"
version = "0.0.0"
description = "Job runner: engines, CAD (cad-worker image), simulation, reports"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fl-engines",
  "procrastinate>=3.5",
  "psycopg[binary,pool]>=3.2",
  "redis>=6.4",
  "pydantic-settings>=2.11",
  "ortools>=9.14",
  "weasyprint>=66",
]

[project.optional-dependencies]
# Installed only in the cad-worker image (sandboxed, no network).
cad = [
  "cadquery>=2.6",
  "trimesh>=4.8",
]

[project.scripts]
fl-worker = "fl_worker.main:run"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
