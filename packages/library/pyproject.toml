[project]
name = "fl-library"
version = "0.0.0"
description = "Catalog and data-pack loader: YAML → validation (docs/10 §1.4, §2.3) → Postgres + pgvector"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fl-domain",
  "fl-engines",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
]

[project.scripts]
fl-library = "fl_library.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
