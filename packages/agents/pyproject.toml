[project]
name = "fl-agents"
version = "0.0.0"
description = "LangGraph stage graphs, tools, LLM router, pipeline runner"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fl-domain",
  "fl-engines",
  "fl-library",
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "litellm==1.106.5",
  "sqlalchemy[asyncio]>=2.0.44",
  "asyncpg>=0.30",
  "procrastinate>=3.5",
  "psycopg[binary,pool]>=3.2",
  "redis>=6.4",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
]

[project.scripts]
fl-agents = "fl_agents.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
