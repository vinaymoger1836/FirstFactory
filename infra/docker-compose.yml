# Factory Layout Platform — local and prod stack (docs/11 §1).
# Run from the repo root so ${VARS} come from the git-ignored .env:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --wait
# Memory limits follow the 2 OCPU / 12 GB budget in docs/11 §1.

name: factory

x-build: &build
  context: ..
  dockerfile: infra/docker/python.Dockerfile

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]
    mem_limit: 128m

  migrate:
    image: ${IMAGE_PREFIX:-factory}-api:${IMAGE_TAG:-local}
    build: { <<: *build, target: api }
    # Schema migrations, then catalog + data-pack validation and versioned load (docs/10 §1.4,
    # §2.3). Any validation error fails this step, so the stack does not start on a bad library.
    # Then LangGraph's checkpoint tables (fl-agents setup, P2).
    command: ["sh", "-c", "alembic upgrade head && fl-library load && fl-agents setup"]
    environment: &api-env
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      QUEUE_DATABASE_URL: ${QUEUE_DATABASE_URL:?set QUEUE_DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    restart: "no"

  api:
    <<: *hardening
    image: ${IMAGE_PREFIX:-factory}-api:${IMAGE_TAG:-local}
    build: { <<: *build, target: api }
    environment: &llm-env
      <<: *api-env
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LLM_ROLE_REASONER: ${LLM_ROLE_REASONER:-groq/openai/gpt-oss-120b}
      LLM_ROLE_EXTRACTOR: ${LLM_ROLE_EXTRACTOR:-groq/openai/gpt-oss-20b}
      LLM_ROLE_WRITER: ${LLM_ROLE_WRITER:-groq/openai/gpt-oss-120b}
      LLM_ROLE_VISION: ${LLM_ROLE_VISION:-gemini/gemini-3.5-flash}
      # live | record | replay (cassettes, docs/14 §4). The e2e override sets replay.
      LLM_MODE: ${LLM_MODE:-live}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # edge: reachable by Caddy and has egress for LLM/web calls; backend: DB + Redis.
    networks: [edge, backend]
    volumes:
      - uploads:/data/uploads
      - derived:/data/derived:ro
    mem_limit: 1024m

  # LangGraph pipeline runner (ADR-024): procrastinate queue `pipeline`, 2 concurrent
  # projects (docs/02 §3). Same image as the api; needs egress for the LLM providers.
  agents:
    <<: *hardening
    image: ${IMAGE_PREFIX:-factory}-api:${IMAGE_TAG:-local}
    build: { <<: *build, target: api }
    command: ["fl-agents", "worker"]
    environment:
      <<: *llm-env
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,time; sys.exit(0 if time.time()-float(open('/tmp/fl-heartbeat').read())<30 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [edge, backend]
    volumes:
      - uploads:/data/uploads:ro
    mem_limit: 1024m

  worker:
    <<: *hardening
    image: ${IMAGE_PREFIX:-factory}-worker:${IMAGE_TAG:-local}
    build: { <<: *build, target: worker }
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      QUEUE_DATABASE_URL: ${QUEUE_DATABASE_URL:?set QUEUE_DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend]          # internal network: no internet egress
    volumes:
      - uploads:/data/uploads:ro   # PDFs are parsed here (docs/11 §2)
    mem_limit: 3g
    cpus: 1.0

  cad-worker:
    <<: *hardening
    image: ${IMAGE_PREFIX:-factory}-cad-worker:${IMAGE_TAG:-local}
    build: { <<: *build, target: cad-worker }
    # Untrusted CAD parsing (CLAUDE.md rule 9): no internet, read-only FS except /tmp,
    # CPU/memory/pid limits, no LLM keys in its environment.
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      QUEUE_DATABASE_URL: ${QUEUE_DATABASE_URL:?set QUEUE_DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      HOME: /tmp
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - uploads:/data/uploads:ro
      - derived:/data/derived      # GLB output only
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [sandbox]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 128

  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [backend, sandbox]
    mem_limit: 1536m

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # No persistence (queue state lives in Postgres, ADR-019), so Redis never forks for a
    # background save. That makes its ARM64 copy-on-write kernel-bug guard irrelevant; the
    # guard's self-test also misfires under QEMU (P0), so it is silenced explicitly.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "160mb",
              "--maxmemory-policy", "noeviction", "--ignore-warnings", "ARM64-COW-BUG"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [backend, sandbox]
    mem_limit: 256m

networks:
  edge: {}
  backend: { internal: true }
  sandbox: { internal: true }

volumes:
  pgdata: {}
  caddy_data: {}
  uploads: {}     # user files (docs/11 §2); deleted with the project in P9's retention job
  derived: {}     # files made from uploads (GLB previews)
