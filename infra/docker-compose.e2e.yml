# End-to-end override (docs/14 §4): LLM calls replay recorded cassettes and vendor research
# replays recorded searches and pages, so runs are repeatable and use no quota and no network.
# For a recording pass set LLM_MODE=record and WEB_MODE=record (needs real keys in .env) — the
# cassette and web-fixture directories are then written to.
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml up -d --wait
services:
  api:
    environment:
      LLM_MODE: ${LLM_MODE:-replay}
      WEB_MODE: ${WEB_MODE:-replay}
    volumes:
      - ${CASSETTE_HOST_DIR:-../golden/cassettes}:/app/cassettes
      - ${WEB_FIXTURE_HOST_DIR:-../golden/web}:/app/web-fixtures
  agents:
    environment:
      LLM_MODE: ${LLM_MODE:-replay}
      WEB_MODE: ${WEB_MODE:-replay}
    volumes:
      - ${CASSETTE_HOST_DIR:-../golden/cassettes}:/app/cassettes
      - ${WEB_FIXTURE_HOST_DIR:-../golden/web}:/app/web-fixtures
