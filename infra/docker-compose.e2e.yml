# End-to-end override (docs/14 §4): LLM calls replay recorded cassettes, so runs are
# repeatable and use no quota. For a recording pass set LLM_MODE=record (needs real keys in
# .env) — the cassette directory is then written to.
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml up -d --wait
services:
  api:
    environment:
      LLM_MODE: ${LLM_MODE:-replay}
    volumes:
      - ${CASSETTE_HOST_DIR:-../golden/cassettes}:/app/cassettes
  agents:
    environment:
      LLM_MODE: ${LLM_MODE:-replay}
    volumes:
      - ${CASSETTE_HOST_DIR:-../golden/cassettes}:/app/cassettes
