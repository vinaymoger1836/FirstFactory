    utilities: {kw: 20, demand_factor: 0.6, exhaust: true}
    footprint_m2: 12.0
    zone_kind: esd_assembly
    hazards: [hot_surface, fumes]
    example_params: {n_components: 120, board_length_mm: 120}
    provenance: *est

  - code: aoi_inspect
    name: Automated optical inspection (AOI)
    description: Camera inspection of solder joints and component placement after reflow.
    aliases: [AOI, optical inspection]
    applies_to: {archetype: [generic_electronics], commodity: [pcba]}
    task_type: machine_paced
    machine_class: aoi_machine
    skill: skilled
    time_model: {formula: "10 + n_components * 0.05", distribution: triangular, spread_pct: 10}
    fpy: 0.995
    quality_checks: [solder_joint_inspection]
    utilities: {kw: 1.5, demand_factor: 0.6}
    footprint_m2: 4.0
    zone_kind: esd_assembly
    example_params: {n_components: 120, board_length_mm: 120}
    provenance: *est

  - code: tht_insert_manual
    name: Manual through-hole insertion
    description: Insert through-hole components by hand before wave or selective soldering.
    aliases: [THT, through hole, manual insertion]
