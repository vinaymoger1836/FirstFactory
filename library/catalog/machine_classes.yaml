# Machine classes (docs/10 §1.1). kW is nameplate per unit; heat_fraction is the share of
# electrical input released as heat in the room (HVAC, docs/06 §3.3). Prices are INR ranges
# per unit, ex-works, before GST; all catalog estimates unless provenance says otherwise.
kind: machine_class

x-est: &est
