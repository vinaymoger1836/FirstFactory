      - {ref: containers, name: Ingredient containers, commodity: food_contact_container, kind: part, qty_expr: n_containers, uom: unit, make_or_buy: buy, subassembly: dispensing, parent: dispensing}
      - {ref: flour_motor, name: Flour dispenser geared motor, commodity: electric_motor, kind: part, qty_expr: "1", uom: unit, make_or_buy: buy, subassembly: dispensing, parent: dispensing}
      - {ref: flour_gears, name: Flour dispenser gears and wheel, commodity: gears, kind: part, qty_expr: "1", uom: unit, make_or_buy: buy, subassembly: dispensing, parent: dispensing, note: "confirm: patent lists blade, compartmental wheel, packer, knocker and gear box"}
