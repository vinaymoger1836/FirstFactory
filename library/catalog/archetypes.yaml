  # 2026.11.4: automatic flat-bread (roti) maker. A functional decomposition taken from public
  # patents (US 8,820,221 unit list; dispensing, kneading and no-flip cooking patents) and press;
  # it is not a teardown. Quantities marked "confirm" must be replaced from the user's BoM.
  - code: roti_maker
    name: Automatic roti maker (dosing, kneading, press and heat)
    category: mechanical
    description: Countertop appliance that doses flour, water and oil, kneads one dough ball, presses it flat between two heated platens and cooks it. Bought controller PCBA and power supply; in-house assembly.
    aliases: [roti maker, rotimatic, roti machine, chapati maker, automatic roti maker, flatbread maker, flat bread machine]
    parameters:
      - {name: rated_power_w, unit: W, description: Rated input power}
      - {name: mains_v, unit: V, description: Nominal mains voltage of the variant}
      - {name: n_containers, unit: unit, description: "Ingredient containers (flour, water and oil)"}
      - {name: n_platens, unit: unit, description: Heated platens (upper and lower)}
      - {name: n_motors, unit: unit, description: Drive motors in total (confirm from the BoM)}
      - {name: n_sensors, unit: unit, description: Sensors in total (confirm from the BoM)}
      - {name: units_per_carton, unit: unit, description: Machines per shipper carton}
    example_variants:
      - code: RM-120V
        name: Roti maker 110-120 V
        params: {rated_power_w: 1800, mains_v: 120, n_containers: 3, n_platens: 2, n_motors: 10, n_sensors: 15, units_per_carton: 1}
      - code: RM-230V
        name: Roti maker 220-240 V
