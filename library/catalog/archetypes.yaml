      - {ref: oil_valve, name: Oil dosing valve, commodity: solenoid_valve, kind: part, qty_expr: "1", uom: unit, make_or_buy: buy, subassembly: dispensing, parent: dispensing, note: "confirm: pump or valve"}
      - {ref: liquid_tubing, name: Liquid tubing, commodity: tubing_hoses, kind: part, qty_expr: "1", uom: unit, make_or_buy: buy, subassembly: dispensing, parent: dispensing}
      - {ref: level_sensors, name: Container level sensors, commodity: sensors, kind: part, qty_expr: n_containers, uom: unit, make_or_buy: buy, subassembly: dispensing, parent: dispensing}
      - {ref: kneading, name: Mixing and kneading unit, kind: assembly, qty_expr: "1", uom: unit, make_or_buy: make, subassembly: kneading}
