    provenance: *est

  - code: dock
    name: Receiving / dispatch dock
    category: logistics
    lighting_w_m2: 5
    lux: 200
    default_height_m: 6
    min_aspect: 1
    max_aspect: 6
    floor: concrete
    hvac: none
    rules:
      - {kind: on_boundary}
    provenance: *est

  - code: office
    name: Office and planning
    category: office
    lighting_w_m2: 8
    lux: 500
    default_height_m: 3.2
    min_aspect: 1
    max_aspect: 3
    floor: tile
    hvac: ac
    area_per_person_m2: 8
    fitout_inr_per_m2: {low: 8000, base: 15000, high: 30000, as_of: "2026-11", source: catalog-estimate}
