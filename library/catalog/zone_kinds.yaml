    lux: 200
    default_height_m: 4
    min_aspect: 1
    max_aspect: 2
    floor: chemical_resistant
    hvac: ventilation
    hazards: [flammable]
    rules:
      - {kind: ventilated}
      - {kind: on_boundary}
      - {kind: keep_apart, target_kind: canteen, distance_m: 15}
    provenance: *est

  - code: rack_storage
    name: Raw material racking
    category: storage
    lighting_w_m2: 5
