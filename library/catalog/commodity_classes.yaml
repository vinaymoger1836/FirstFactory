    storage_class: li_ion_hazard
    hazards: [li_ion]
    lead_time_days: {low: 30, base: 60, high: 90}
    pack_qty: 200
    cartons_per_pallet: 20
    iqc_checks: [cell_ocv_ir, visual_inspection]
