# Commodity classes (docs/10 §1.1): taxonomy for BoM lines, vendor search, IQC and storage.
# Lead times are days from PO to receipt (imported cells long, local mouldings short).
kind: commodity_class

x-est: &est
  source: catalog-estimate
  as_of: "2026-11"
  confidence: 0.4
  note: Engineering estimate; vendor research (docs/09 §2) overrides lead times and prices.

entries:
  - code: li_ion_cell
    name: Lithium-ion cells (cylindrical / pouch)
    aliases: ["18650", "21700", battery cell, li-ion cell]
    uom: unit
    storage_class: li_ion_hazard
    hazards: [li_ion]
    lead_time_days: {low: 30, base: 60, high: 90}
    pack_qty: 200
    cartons_per_pallet: 20
    iqc_checks: [cell_ocv_ir, visual_inspection]
    default_aql: 0.65
    unit_price_inr: {low: 150, base: 250, high: 400, as_of: "2026-11", source: catalog-estimate}
    default_material: li_ion_cylindrical
    cad_rarely_modelled: true
    spec_fields:
      - {code: format, name: Cell format, kind: choice, choices: ["18650", "21700", "26650", pouch, prismatic]}
      - {code: capacity_mah, name: Rated capacity, kind: number, unit: mAh}
      - {code: nominal_v, name: Nominal voltage, kind: number, unit: V}
      - {code: max_discharge_a, name: Max continuous discharge, kind: number, unit: A, required: false}
      - {code: chemistry, name: Chemistry (e.g. NMC or LFP), kind: text, required: false}
    provenance: *est

