# Commodity classes (docs/10 §1.1): taxonomy for BoM lines, vendor search, IQC and storage.
# Lead times are days from PO to receipt (imported cells long, local mouldings short).
kind: commodity_class

x-est: &est
  source: catalog-estimate
  as_of: "2026-11"
  confidence: 0.4
  note: Engineering estimate; vendor research (docs/09 §2) overrides lead times and prices.

