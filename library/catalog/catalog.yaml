# Process catalog manifest (docs/10 §1). Version string YYYY.MM.patch; projects pin it (ADR-009).
# Bump the version for ANY content change: the loader refuses to reload a version with
# different content.
version: "2026.11.5"
effective_date: 2026-11-19
description: >
  POC seed covering both golden products (power bank, BLDC ceiling fan) plus common generic
  steps (SMT, reflow, AOI, moulding, ultrasonic welding) for future products. Numbers are
  engineering estimates unless an entry's provenance says otherwise; they are shown with
  lower confidence in projects.
  2026.11.2 (P3): materials (density, price per kg); commodity classes gain make_route,
  default_material and cad_rarely_modelled.
  2026.11.3 (ADR-027, Proposed): commodity classes gain spec_fields (the attributes that
  identify a part); 10 general mechanical classes and 3 materials added, without prices.
  2026.11.5 (P3b, ADR-028): check types gain characteristic, limit, instrument_class, frequency,
  reaction and supports_compliance (docs/15 §3); routing steps gain builds/consumes; archetypes
  gain a quality block; new kinds sampling_plan (ISO 2859-1) and policy (operating defaults,
  vendor research).
files:
  - archetypes.yaml
  - commodity_classes.yaml
  - zone_kinds.yaml
  - check_types.yaml
  - machine_classes.yaml
  - processes.yaml
  - mtm_elements.yaml
  - materials.yaml
  - sampling_plans.yaml
  - policies.yaml
